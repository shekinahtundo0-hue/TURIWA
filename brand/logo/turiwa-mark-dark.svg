<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="markDarkBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Dark Mode 135° Neon Gradient: #00FF87 -> #10B981 -->
    <linearGradient id="flowGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter: 0 0 24px rgba(0, 255, 135, 0.4) -->
    <filter id="flowGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="ambientAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="112" fill="url(#markDarkBg)" />
  <circle cx="256" cy="256" r="200" fill="url(#ambientAura)" />

  <!-- Subtle Golden Ratio Grid Reference Accents -->
  <circle cx="256" cy="256" r="150" stroke="#10B981" stroke-width="1" stroke-dasharray="3 6" opacity="0.18" fill="none" />
  <circle cx="256" cy="220" r="92" stroke="#00FF87" stroke-width="1" stroke-dasharray="3 6" opacity="0.18" fill="none" />

  <!-- Logo Concept A: The Flow Mark -->
  <g filter="url(#flowGlowDark)">
    <!-- Central Converging Spine forming dynamic T -->
    <path d="M 256,400 L 256,155" 
          stroke="url(#flowGradDark)" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Left Flowing Branch -->
    <path d="M 190,380 C 215,315 220,265 256,220 C 235,180 180,165 130,165" 
          stroke="url(#flowGradDark)" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Right Flowing Branch -->
    <path d="M 322,380 C 297,315 292,265 256,220 C 277,180 332,165 382,165" 
          stroke="url(#flowGradDark)" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Primary Top Crossbar -->
    <path d="M 130,165 C 172,138 218,132 256,132 C 294,132 340,138 382,165" 
          stroke="url(#flowGradDark)" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Dynamic Flow Lattice Ribs -->
    <path d="M 155,205 C 205,178 256,178 256,178 C 256,178 307,178 357,205" 
          stroke="url(#flowGradDark)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 180,265 C 218,245 256,245 256,245 C 256,245 294,245 332,265" 
          stroke="url(#flowGradDark)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 190,380 C 230,370 256,380 256,400 C 256,380 282,370 322,380" 
          stroke="url(#flowGradDark)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Interconnected Nodes -->
    <!-- Top Horizontal Crossbar Nodes -->
    <circle cx="130" cy="165" r="14" fill="#00FF87" />
    <circle cx="130" cy="165" r="6" fill="#0F172A" />

    <circle cx="198" cy="140" r="10" fill="#00FF87" />
    <circle cx="256" cy="132" r="15" fill="#00FF87" />
    <circle cx="256" cy="132" r="6" fill="#0F172A" />
    <circle cx="314" cy="140" r="10" fill="#00FF87" />

    <circle cx="382" cy="165" r="14" fill="#00FF87" />
    <circle cx="382" cy="165" r="6" fill="#0F172A" />

    <!-- Mid Elevation Nodes -->
    <circle cx="155" cy="205" r="10" fill="#00FF87" />
    <circle cx="357" cy="205" r="10" fill="#00FF87" />

    <circle cx="256" cy="220" r="13" fill="#10B981" />
    <circle cx="256" cy="220" r="5" fill="#00FF87" />

    <circle cx="180" cy="265" r="9" fill="#10B981" />
    <circle cx="332" cy="265" r="9" fill="#10B981" />

    <!-- Lower Stem Nodes -->
    <circle cx="256" cy="315" r="11" fill="#10B981" />
    <circle cx="190" cy="380" r="12" fill="#10B981" />
    <circle cx="190" cy="380" r="5" fill="#00FF87" />
    <circle cx="322" cy="380" r="12" fill="#10B981" />
    <circle cx="322" cy="380" r="5" fill="#00FF87" />

    <!-- Base Root Node -->
    <circle cx="256" cy="400" r="16" fill="#00FF87" />
    <circle cx="256" cy="400" r="7" fill="#0F172A" />
  </g>
</svg>
