<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light Mode Gradient: Forest #065F46 to Kelly #22C55E -->
    <linearGradient id="monogramLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="monogramShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#065F46" flood-opacity="0.14" />
    </filter>

    <mask id="monogramStemWaveMaskLight">
      <rect width="512" height="512" fill="#FFFFFF" />
      <path d="M 80,290 C 160,250 200,310 280,265 C 330,235 390,260 440,240 C 390,285 320,260 270,295 C 210,335 150,285 80,290 Z" fill="#000000" />
      <polygon points="256,260 276,280 256,274 236,280" fill="#000000" />
    </mask>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />

  <!-- Ambient Light Circle -->
  <circle cx="256" cy="235" r="160" fill="#F0FDF4" />

  <!-- Monogram T in Forest & Kelly green -->
  <g filter="url(#monogramShadowLight)">
    <!-- Base T Shape -->
    <g mask="url(#monogramStemWaveMaskLight)">
      <path d="M 120,130 
               L 392,130 
               L 392,175 
               L 352,215 
               L 296,215 
               L 296,350 
               L 336,390 
               L 176,390 
               L 216,350 
               L 216,215 
               L 160,215 
               L 120,175 Z" 
            fill="none" 
            stroke="url(#monogramLightGrad)" 
            stroke-width="12" 
            stroke-linejoin="miter" />

      <!-- Inner geometric ridge -->
      <path d="M 145,150 
               L 367,150 
               L 367,170 
               L 335,202 
               L 278,202 
               L 278,355 
               L 296,373 
               L 216,373 
               L 234,355 
               L 234,202 
               L 177,202 
               L 145,170 Z" 
            fill="#22C55E" 
            fill-opacity="0.10" 
            stroke="#22C55E" 
            stroke-width="2.5" />
    </g>

    <!-- Vector Wave cutting through stem -->
    <path d="M 100,285 C 170,245 210,305 280,265 C 330,238 385,258 420,242 C 380,280 320,258 270,292 C 210,332 160,282 100,285 Z" 
          fill="url(#monogramLightGrad)" />

    <!-- Upward Momentum Node -->
    <polygon points="256,238 272,260 256,254 240,260" fill="#22C55E" />

    <!-- Typographic Wordmark -->
    <text x="256" y="445" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="700" 
          font-size="28" 
          letter-spacing="9" 
          fill="#065F46" 
          text-anchor="middle">TURIWA</text>
  </g>
</svg>
